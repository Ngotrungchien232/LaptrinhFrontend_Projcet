<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/accets/css/admin.css" />
  </head>
  <body>
    <div class="admin-container">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">Admin Dashboard</div>
        <ul class="sidebar-menu">
          <li class="active">
            <a href="#schedules"> Quản lý lịch </a>
          </li>
          <li>
            <a href="/accets/pages/admin/services.html"> Quản lý dịch vụ </a>
          </li>
          <li>
            <a href="/accets/index.html"> Trang chủ </a>
          </li>
          <li>
            <a href="/accets/pages/auth/login.html" onclick="logout()">
              <i class="fas fa-sign-out-alt"></i> Đăng xuất
            </a>
          </li>
        </ul>
      </div>

      <!-- Main Content -->
      <div class="main-content">
        <!-- Header -->
        <div class="header">
          <h1>Quản lý lịch tập</h1>
        
           
          </button>
        </div>

        <!-- Stats Cards -->
        <div class="stats-container">
          <div class="stat-card">
            <h3>Gym</h3>
            <p id="gymCount">0</p>
          </div>
          <div class="stat-card">
            <h3>Yoga</h3>
            <p id="yogaCount">0</p>
          </div>
          <div class="stat-card">
            <h3>Zumba</h3>
            <p id="zumbaCount">0</p>
          </div>
        </div>

        <!-- Filters -->
        <div class="filter-section">
          <input
            type="text"
            id="filterEmail"
            class="form-control"
            placeholder="Tìm theo email"
          />
          <select id="filterClass" class="form-select">
            <option value="">Tất cả lớp học</option>
            <option value="gym">Gym</option>
            <option value="yoga">Yoga</option>
            <option value="zumba">Zumba</option>
          </select>
          <input type="date" id="filterDate" class="form-control" />
        </div>

        <!-- Schedule Table -->
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Lớp học</th>
                <th>Ngày</th>
                <th>Thời gian</th>
                <th>Họ tên</th>
                <th>Email</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="scheduleTableBody">
              <!-- Dữ liệu sẽ được thêm vào đây bằng JavaScript -->
            </tbody>
          </table>
          <div id="pagination" class="pagination">
            <!-- Phân trang sẽ được thêm vào đây -->
          </div>
        </div>

        <!-- Chart -->
        <div class="chart-container">
          <canvas id="scheduleChart"></canvas>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/accets/js/admin.js"></script>
  </body>
</html>
